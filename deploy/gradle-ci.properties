# Installed only in the Android job's temporary GRADLE_USER_HOME.
# User-home properties override android/gradle.properties without changing local builds.
org.gradle.jvmargs=-Xmx4096m -Xss512k -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.vfs.watch=false
kotlin.compiler.execution.strategy=in-process
