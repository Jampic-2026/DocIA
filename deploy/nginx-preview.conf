# Private preview only: do not bind to 0.0.0.0 or an external interface.
server {
    listen 127.0.0.1:8088;
    server_name localhost;
    root /var/www/docia-monorepo/deploy/current-web/web;
    location = /docia-release.txt { add_header Cache-Control "no-store"; try_files $uri =404; }
    location /downloads/ { add_header Cache-Control "no-store"; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 127.0.0.1:8089;
    server_name localhost;
    root /var/www/docia-monorepo/deploy/current-landing/landing;
    location = /docia-release.txt { add_header Cache-Control "no-store"; try_files $uri =404; }
    location /downloads/ {
        alias /var/www/docia-monorepo/deploy/current-web/web/downloads/;
        add_header Cache-Control "no-store";
    }
    location / { try_files $uri $uri/ /index.html; }
}
