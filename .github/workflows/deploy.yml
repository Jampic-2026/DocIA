name: Verify and deploy DocIA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docia-monorepo-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  DOCIA_PUBLIC_CONFIG_FILE: ${{ github.workspace }}/config/environments/production.env
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 / Node 24
        with:
          node-version: "22"
      - name: Show deployment eligibility
        env:
          DOCIA_DEPLOY_FLAG: ${{ vars.DOCIA_DEPLOY_ENABLED }}
          DOCIA_DEPLOY_CONDITION: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCIA_DEPLOY_ENABLED == 'true' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const flag = process.env.DOCIA_DEPLOY_FLAG || '';
          const report = {
            repository: process.env.GITHUB_REPOSITORY,
            ref: process.env.GITHUB_REF,
            event: process.env.GITHUB_EVENT_NAME,
            workflow: process.env.GITHUB_WORKFLOW_REF,
            commit: process.env.GITHUB_SHA,
            DOCIA_DEPLOY_ENABLED: ['true', 'false'].includes(flag)
              ? flag : flag === '' ? '(no disponible)' : '(valor inválido; omitido)',
            deployCondition: process.env.DOCIA_DEPLOY_CONDITION === 'true',
          };
          const details = JSON.stringify(report, null, 2);
          console.log(details);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Deployment eligibility\n\n\`\`\`json\n${details}\n\`\`\`\n`);
          if (!report.deployCondition) {
            console.log('::notice::Android y deploy se omitirán. Se requiere main, un evento distinto de pull_request y la repository variable DOCIA_DEPLOY_ENABLED=true. Revisar el diagnóstico anterior.');
          }
          NODE
      - run: npm ci --prefix Landing --no-audit --no-fund
      - run: npm run test:tools
      - run: node --test deploy/tests/landing-env.test.cjs
      - run: node deploy/check-upload.cjs
      - run: node deploy/audit-api-env.cjs
      - run: |
          for script in deploy/deploy.sh deploy/ssh-deploy.sh deploy/setup-server.sh; do
            bash -n "$script"
          done
          shellcheck deploy/deploy.sh deploy/ssh-deploy.sh deploy/setup-server.sh deploy/tests/deploy.test.sh
          bash deploy/tests/deploy.test.sh

  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 / Node 24
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: node --test ../deploy/tests/api-env.test.cjs
      - run: npm run lint:check
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Package verified API
        working-directory: .
        run: node deploy/package.cjs api
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 / Node 24
        with:
          name: api
          path: release/*
          if-no-files-found: error
          retention-days: 3

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: APP-MVP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 / Node 24
        with:
          node-version: "22"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true
      - run: node ../deploy/write-web-config.cjs
        env:
          DOCIA_WEB_CONFIG_JSON: ${{ vars.DOCIA_WEB_CONFIG_JSON }}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define-from-file=config/ci-production.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 / Node 24
        with:
          name: web-build
          path: APP-MVP/build/web/
          if-no-files-found: error
          retention-days: 3

  landing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: Landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 / Node 24
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: node ../deploy/write-landing-config.cjs
      - run: npm run build
      - name: Prepare verified Netlify landing
        working-directory: .
        run: node deploy/netlify-deploy.cjs stage landing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 / Node 24
        with:
          name: landing-build
          path: payload/landing/
          if-no-files-found: error
          retention-days: 3

  android:
    needs: [tools, api, web, landing]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCIA_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: APP-MVP
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, Node 24
        with:
          node-version: "22"
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0, Node 24
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Gradle memory for Android CI
        run: |
          ci_gradle_home="$RUNNER_TEMP/docia-gradle"
          install -d -m 700 "$ci_gradle_home/init.d"
          install -m 600 ../deploy/gradle-ci.properties "$ci_gradle_home/gradle.properties"
          install -m 600 ../deploy/check-gradle-ci.init.gradle "$ci_gradle_home/init.d/docia-ci.gradle"
          printf 'GRADLE_USER_HOME=%s\n' "$ci_gradle_home" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.35.6"
          channel: stable
          cache: true
      - name: Write public production configuration
        env:
          DOCIA_WEB_CONFIG_JSON: ${{ vars.DOCIA_WEB_CONFIG_JSON }}
        run: node ../deploy/write-web-config.cjs
      - run: flutter pub get --enforce-lockfile
      - name: Restore and verify existing Android release signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ANDROID_VERSION_CODE_BASE=$(node -p "require('../config/android-version.json').versionCodeBase")
          export ANDROID_VERSION_CODE_BASE
          node ../deploy/android-release.cjs prepare
          node ../deploy/android-release.cjs verify-keystore
      - name: Build signed Android APK
        env:
          ANDROID_BUILD_NUMBER: ${{ steps.signing.outputs.build_number }}
        run: flutter build apk --release --build-number="$ANDROID_BUILD_NUMBER" --dart-define-from-file=config/ci-production.json
      - name: Verify signature and Android identity
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root" || { echo '::error::Falta Android SDK.'; exit 1; }
          tools_dir=$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -f "$tools_dir/lib/apksigner.jar" && test -x "$tools_dir/aapt" || { echo '::error::Faltan apksigner.jar o aapt en Android Build Tools.'; exit 1; }
          printf 'Verificando APK con Android Build Tools %s\n' "$(basename "$tools_dir")"
          "$JAVA_HOME/bin/java" -jar "$tools_dir/lib/apksigner.jar" verify --verbose --print-certs-pem build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/docia-apk-signature.txt"
          "$tools_dir/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk > "$RUNNER_TEMP/docia-apk-badging.txt"
      - name: Package signed APK and public version metadata
        env:
          RELEASE_ID: ${{ env.RELEASE_ID }}
          ANDROID_BUILD_NUMBER: ${{ steps.signing.outputs.build_number }}
        run: node ../deploy/android-release.cjs package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, Node 24
        with:
          name: docia-android
          path: APP-MVP/android-release/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Remove temporary Android signing material
        if: always()
        run: node ../deploy/android-release.cjs clean

  deploy:
    needs: [tools, api, web, landing, android]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCIA_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 / Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 / Node 24
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 / Node 24
        with:
          name: api
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 / Node 24
        with:
          name: landing-build
          path: payload/landing
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 / Node 24
        with:
          name: web-build
          path: APP-MVP/build/web
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 / Node 24
        with:
          name: docia-android
          path: android-release
      - run: node deploy/package.cjs web
      - run: node deploy/netlify-deploy.cjs stage web
      - name: Check both Netlify sites before changing the VPS
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_WEB_SITE_ID: ${{ vars.NETLIFY_WEB_SITE_ID }}
          NETLIFY_LANDING_SITE_ID: ${{ vars.NETLIFY_LANDING_SITE_ID }}
        run: node deploy/netlify-deploy.cjs preflight
      - name: Publish API and signed APK on the isolated VPS installation
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          bash deploy/ssh-deploy.sh api
          bash deploy/ssh-deploy.sh web
      - name: Publish web, then landing on Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_WEB_SITE_ID: ${{ vars.NETLIFY_WEB_SITE_ID }}
          NETLIFY_LANDING_SITE_ID: ${{ vars.NETLIFY_LANDING_SITE_ID }}
        run: |
          node deploy/netlify-deploy.cjs publish web
          node deploy/netlify-deploy.cjs publish landing
